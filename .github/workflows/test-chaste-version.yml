name: Test Chaste Dependency Update

# Only runs on pull requests that touch the Dockerfile (i.e. Dependabot's
# version-bump PRs), and only when the PR was opened by Dependabot.
on:
  pull_request:
    paths:
      - 'Dockerfile'

jobs:
  test-chaste-build:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 180  # full Chaste builds can take a while; adjust if needed

    steps:
      - name: Checkout repository (at the PR's branch)
        uses: actions/checkout@v4

      - name: Extract Chaste image tag from Dockerfile
        id: image
        run: |
          TAG=$(grep -oP '(?<=FROM chaste/release:)\S+' Dockerfile)
          if [ -z "$TAG" ]; then
            echo "Could not find a chaste/release tag in Dockerfile" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Testing against chaste/release:$TAG"

      - name: Pull the Chaste release image
        run: docker pull chaste/release:${{ steps.image.outputs.tag }}

      - name: Build project and run test inside container
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/home/chaste/projects/HeterozygousEGFRSpheroid" \
            chaste/release:${{ steps.image.outputs.tag }} \
            bash -c '
              cd ~/build &&
              build_project.sh HeterozygousEGFRSpheroid c &&
              ctest -V -R TestPC9spheroid2D_multi_experi_heterogenous
            ' 2>&1 | tee test_output.log

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'Log file not found.';
            try {
              log = fs.readFileSync('test_output.log', 'utf8');
            } catch (e) {}

            const tail = log.split('\n').slice(-150).join('\n');
            const tag = '${{ steps.image.outputs.tag }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : 'unknown';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Test failed against Chaste ${tag}`,
              labels: ['chaste-compatibility'],
              body: `The test suite failed when run against \`chaste/release:${tag}\` (triggered by PR #${prNumber}).\n\n**Workflow run:** ${runUrl}\n\n<details><summary>Last 150 lines of output</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n\n</details>\n\nThe Dependabot PR remains open — do not merge until this is resolved (or the new Chaste behaviour is confirmed as intentional and your code updated to match).`
            });
